# Lunar OS GRUB Configuration
# Custom boot menu with Lunar OS branding

set timeout=5
set default=0

# Lunar OS - Boot with Plymouth
menuentry "Lunar OS" {
    linux /live/vmlinuz boot=live components quiet splash --
    initrd /live/initrd.img
}

# Lunar OS - Safe Graphics (for compatibility)
menuentry "Lunar OS (Safe Graphics)" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash --
    initrd /live/initrd.img
}

# Lunar OS - Verbose (for debugging)
menuentry "Lunar OS (Verbose)" {
    linux /live/vmlinuz boot=live components --
    initrd /live/initrd.img
}

# Lunar OS - Memory Test (if available)
menuentry "Memory Test" {
    linux /live/memtest
}
