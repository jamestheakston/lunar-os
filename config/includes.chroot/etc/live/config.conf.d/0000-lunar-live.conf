# Lunar OS Live Configuration
# Configure disposable session with RAM-backed storage

# Force live-boot to use a RAM overlay (tmpfs)
# This ensures all session data is discarded on shutdown
LIVE_MEDIA="none"
LIVE_BOOTPROMPT="live components noprompt quiet splash"

# Use overlayfs with tmpfs for the writable layer
# This creates a completely disposable session
LB_BOOTAPPEND_LIVE="boot=live components noprompt quiet splash"

# Disable persistence (no persistent storage)
# Users cannot create persistent storage by default
LIVE_PERSISTENT="none"

# Set hostname
LIVE_HOSTNAME="lunar-os"

# Set username
LIVE_USERNAME="lunar"
LIVE_USER_FULLNAME="Lunar User"

# Configure automatic login
LIVE_AUTOLOGIN="true"

# Set up the session to be entirely in RAM
# This ensures maximum disposability
