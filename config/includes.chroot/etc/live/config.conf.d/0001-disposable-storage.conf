# Lunar OS Disposable Storage Configuration
# Configure overlayfs with tmpfs for complete session disposability

# Force overlayfs with tmpfs for the writable layer
# This ensures all changes are stored in RAM and discarded on shutdown
LIVE_BOOTPROMPT="live components noprompt quiet splash overlay=tmpfs"

# Additional live-boot options for disposability
# - overlay=tmpfs: Use tmpfs for the overlay (RAM-based)
# - nooverlayfschecksum: Skip checksum verification for faster boot
# - noeject: Don't require eject before shutdown
LB_BOOTAPPEND_LIVE="boot=live components noprompt quiet splash overlay=tmpfs noeject"

# Disable any persistence mechanisms
# Users cannot create persistent storage
LIVE_PERSISTENT="none"
LIVE_PERSISTENT_ENCRYPTION="none"

# Configure union filesystem
# Use overlayfs by default (more efficient than aufs)
LIVE_UNION_FILESYSTEM="overlayfs"

# Set filesystem size limits (prevent filling RAM)
# Limit to 4GB by default (adjust based on available RAM)
LIVE_OVERLAY_SIZE="4G"

# Swap configuration
# Disable swap to prevent data persistence
LIVE_SWAP="none"

# Do not mount any local filesystems
# This prevents accidental data persistence
LIVE_HOSTNAME="lunar-os"
LIVE_USERNAME="lunar"
