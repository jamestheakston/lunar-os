[config]
bm_open_method=0
su_cmd=terminal
terminal=lxterminal
desktop_bg_color=#1e1e1e
desktop_fg=#ffffff
desktop_font=Noto Sans 10
show_wm_menu=0
thumbnail_local=1
thumbnail_max=2048

[desktop]
show_wallpaper=1
wallpaper_mode=crop
wallpaper=/usr/share/backgrounds/lunar-os/wallpaper.png
desktop_folder=/home/lunar/Desktop

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[ui]
always_show_tabs=1
tab_pos=left
win_width=900
win_height=600
side_pane_mode=places
view_mode=list
show_hidden=0
sort_type=2
sort_by=name
single_click=0
use_default_font=1
font=Noto Sans 10

[advanced]
execute_with_entire_path=0
si_unit=0
use_previewer=1
preerun=
autorun=1
 thumbnail_local=1
 thumbnail_max=2048
