backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
