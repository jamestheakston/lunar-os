name: Build Lunar OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: debian:bookworm
      options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          live-build \
          debootstrap \
          syslinux-utils \
          grub-pc-bin \
          grub-common \
          xorriso \
          mtools \
          squashfs-tools \
          rsync \
          librsvg2-bin \
          wget \
          curl \
          git \
          python3 \
          python3-pil

    - name: Generate assets
      run: bash scripts/generate-assets.sh

    - name: Build ISO
      run: bash scripts/build.sh

    - name: Verify desktop in image
      run: |
        unsquashfs -l build/binary/live/filesystem.squashfs > /tmp/squashfs-files.txt
        for f in usr/sbin/lightdm usr/bin/startlxde usr/bin/openbox usr/bin/firefox-esr usr/bin/dunst usr/bin/picom usr/bin/galculator usr/share/lunar-os/welcome.py usr/share/lunar-os/shutdown-dialog.py usr/share/lunar-os/lunar-settings.py usr/share/plymouth/themes/lunar-os/lunar-os.script; do
          if ! grep -q "squashfs-root/$f\$" /tmp/squashfs-files.txt; then
            echo "Missing $f in filesystem.squashfs"
            exit 1
          fi
        done

    - name: Generate checksum
      id: iso
      run: |
        cd build
        ISO_FILE=$(ls *.iso | head -n 1)
        sha256sum "$ISO_FILE" > "$ISO_FILE.sha256"
        cat "$ISO_FILE.sha256"
        ls -lh "$ISO_FILE"
        echo "filename=$ISO_FILE" >> "$GITHUB_OUTPUT"

    - name: Upload ISO as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunar-os-iso
        path: build/*.iso
        retention-days: 7

    - name: Upload checksum as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunar-os-checksum
        path: build/*.sha256
        retention-days: 7

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Lunar OS ${{ github.run_number }}
        body: Automated build of Lunar OS ISO. SHA256 checksum included.
        files: |
          build/${{ steps.iso.outputs.filename }}
          build/${{ steps.iso.outputs.filename }}.sha256
        draft: false
        prerelease: false
